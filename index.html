.ev{height:0;margin:-34px 0 34px;text-align:center;font-size:12.5px;letter-spacing:.18em;color:var(--mute)}
#acct{transition:transform .5s var(--sp),opacity .35s ease}#acct.hide{opacity:0;pointer-events:none}
:root{--t0:#EDE4D8;--t1:#D9A5A0;--t2:#E6C79C;--t3:#B7CCAB;--t4:#8FB5B3;--t5:#BDB4D6}
.ev{margin:-38px 0 38px;padding:0 12px;line-height:1.5;letter-spacing:.08em;transition:opacity .45s}

.lg{flex-wrap:wrap}

/* nav */
nav{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--sh);z-index:5;width:min(92vw,400px)}

if(ch){S.memories=[...new Set(S.memories)].sort((a,b)=>a-b).slice(0,4000);save();Cloud.pushUser()}return hit}
const memMedia=c=>!c.url?'':c.ty==='photo'?`<img class="mp" src="${esc(c.url)}" alt="" loading="lazy" onerror="this.outerHTML='<p class=hint>圖片無法載入</p>'">`:c.ty==='audio'?`<audio controls preload="none" src="${esc(c.url)}" style="width:100%;margin:6px 0 10px"></audio>`:c.ty==='video'?`<button class="mv" data-u="${esc(c.url)}">${ZI.video}播放影片</button>`:`<p><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">開啟連結</a></p>`;
const memHtml=(c,td)=>`<div class="mhd">記憶顯影</div><div class="orn"><i></i>${ZI.spark}<i></i></div><h3>${td?'歷史上的今天':'出道第 '+c.day+' 天的足跡'}</h3>${c.date?`<div class="mdt">${esc(c.date)}</div>`:''}${c.title?`<div class="mtt">${esc(c.title)}</div>`:''}${memMedia(c)}${c.text?`<p class="mtx">${esc(c.text)}</p>`:''}${crHtml(c.credit)}`;
let pendMem=null;
function memOpen(c,re,td){$('#memb').innerHTML=memHtml(c,td);$('#memOk').textContent=re?'關閉':'收進圖鑑';$('#memd').classList.add('on');$('#memd .paper').scrollTop=0}
function memShow(){if(!pendMem)return;const c=pendMem;pendMem=null;memOpen(c,false);cur==='time'&&rZukan()}
function memClose(){$('#memd').classList.remove('on');const a=$('#memb audio');a&&a.pause();setTimeout(()=>{$('#memb').innerHTML=''},500)}
$('#memOk').onclick=memClose;$('#memd').onclick=e=>{if(e.target.id==='memd')return memClose();const v=e.target.closest('.mv');if(v){const u=v.dataset.u;memClose();play({url:u})}};
addEventListener('keydown',e=>{if(e.key==='Escape')memClose()});
ZI.chev=zsv('<path d="M9 6l6 6-6 6"/>');
function rToday(){const el=$('#tdy');if(!el)return;const d=new Date(),L=memPool().filter(c=>c.mo===d.getMonth()+1&&c.dd===d.getDate()).sort((a,b)=>a.yr-b.yr);
el.innerHTML=L.length?`<div class="card"><div class="row"><span class="name">歷史上的今天</span><span class="tdd">${d.getMonth()+1} 月 ${d.getDate()} 日</span></div><div class="tl">${L.map(c=>`<button class="tr" data-t="${c.day}">${ZI[c.ty||'text']}<div><small>${c.yr||''}</small><span>${esc(c.title||'未命名')}</span></div>${ZI.chev}</button>`).join('')}</div></div>`:''}
const ZD={reward:'時光樹盛開後，魔力每滿 50h 施法一次，就能抽到隨機卡片。',memory:'連續打卡天數與平假名櫸/日向坂結成天數同步時，就會收到記憶卡片，重溫她們一路走來的足跡。',item:'解鎖連續打卡成就，收集各式布景與配飾來裝扮畫面。（即將開放）'};
function rZukan(){const el=$('#zk');if(!el)return;let body='';
if(ZK==='reward'){const P=rewards();if(!EV.rwOk||(!P.length&&!SF.rw))body='<div class="empty">載入中…</div>';else{const U=new Set(S.unlocked),n=P.filter(r=>U.has(r.id)).length;
body=P.length?`<div class="zs"><span>已收集</span><span>${n} / ${P.length}</span></div><div class="zg">${P.map(r=>U.has(r.id)?`<button class="zc" data-r="${esc(r.id)}">${ZI[r.type]}<span>${esc(r.title||'未命名')}</span></button>`:`<div class="zc lk">${ZI.lock}<span>？</span></div>`).join('')}</div>`:'<div class="empty">目前沒有可收集的獎勵</div>'}}
if(ZK==='memory'){const P=memPool();if(!EV.memOk||(!P.length&&!SF.mem))body='<div class="empty">載入中…</div>';else{const U=new Set(S.memories),n=P.filter(c=>U.has(c.day)).length;
body=P.length?`<div class="zs"><span>已收集</span><span>${n} / ${P.length}</span></div><div class="zg">${P.map(c=>U.has(c.day)?`<button class="zc" data-m="${c.day}">${ZI[c.ty||'text']}<small>第 ${c.day} 天</small><span>${esc(c.title||'未命名')}</span></button>`:`<div class="zc lk">${ZI.lock}<span>第 ${c.day} 天</span></div>`).join('')}</div>`:'<div class="empty">目前沒有可收集的記憶</div>'}}
if(ZK==='item')body=`<div class="zl">${ZI.lock}</div>`;
el.innerHTML=`<div class="card"><div class="row"><span class="name">圖鑑</span></div><div class="zt">${[['reward','獎勵',1],['memory','記憶',1],['item','道具',0]].map(([k,n,o])=>`<button data-zk="${k}" class="${k===ZK?'on':''}${o?'':' lk'}">${o?'':ZI.lock}${n}</button>`).join('')}</div><p class="zd">${ZD[ZK]}</p>${body}</div>`}
$('#tBody').onclick=e=>{if(e.target.closest('#wand'))return cast();if(e.target.closest('#gLogin'))return privOpen();
const z=e.target.closest('[data-zk]');if(z){ZK=z.dataset.zk;return rZukan()}
const c=e.target.closest('.zc[data-r]');if(c){const r=rewards().find(x=>x.id===c.dataset.r);if(r){$('#mgh').textContent=r.title||'獎勵';$('#mgb').innerHTML=rwHtml(r);$('#mgd').classList.add('on')}}
const m=e.target.closest('.zc[data-m]');if(m){const x=memPool().find(y=>y.day==m.dataset.m);x&&memOpen(x,true)}
const tt=e.target.closest('.tr[data-t]');if(tt){const x=memPool().find(y=>y.day==tt.dataset.t);x&&memOpen(x,true,true)}};
/* PWA */
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
tick();evShow();loadSheets();setInterval(tick,1000);pill();bgStart();acctRender();mgDot();document.fonts&&document.fonts.ready.then(pill);
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,deleteUser} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=ZEN_CONFIG;
if(C.firebase.apiKey&&!C.firebase.apiKey.startsWith('YOUR')){
  const app=initializeApp(C.firebase),auth=getAuth(app),db=getFirestore(app),gp=new GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});
  Cloud.off=false;
  Cloud.login=async()=>{try{await signInWithPopup(auth,gp)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))signInWithRedirect(auth,gp);else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast('登入失敗：'+e.code)}};
  Cloud.logout=()=>signOut(auth);
  let dead=false,tmr=null,last='';
  const fail=e=>{console.warn(e);last='';if(e&&e.code==='resource-exhausted'){if(!dead){dead=true;toast('雲端今日用量已滿，暫時只存在本機')}}else toast('同步失敗，請稍後再試')};
  Cloud.pushUser=()=>{if(!Cloud.user||dead)return;clearTimeout(tmr);tmr=setTimeout(()=>{const sig=JSON.stringify([S.log.map(l=>l.id),S.off,S.goal,S.casts,S.unlocked,S.base,S.memories]);if(sig===last)return;last=sig;setDoc(doc(db,'users',Cloud.user.uid),{log:S.log,off:S.off,goal:S.goal,casts:S.casts,unlocked:S.unlocked,base:S.base,memories:S.memories,t:Date.now()}).catch(fail)},2000)};
  Cloud.pushCfg=()=>{if(Cloud.admin&&!dead)setDoc(doc(db,'config','main'),{members:S.members,videos:S.videos,bgs:S.bgs,events:S.events||[],t:Date.now()}).catch(fail)};
  Cloud.deleteAccount=async()=>{const u=auth.currentUser;if(!u)return;clearTimeout(tmr);
    try{await deleteDoc(doc(db,'users',u.uid));S.log=[];S.off=[];S.casts=0;S.unlocked=[];S.base=0;S.memories=[];save();last='';render();await deleteUser(u);toast('已刪除你的資料與帳號')}
    catch(e){console.warn(e);toast(e.code==='auth/requires-recent-login'?'雲端紀錄已刪除。請登出後重新登入，再按一次以移除帳號':'刪除失敗：'+(e.code||'請稍後再試'))}};
  const loadCfg=()=>getDoc(doc(db,'config','main')).then(sn=>{if(sn.exists())applyCfg(sn.data())}).catch(e=>console.warn(e));
  const loadUser=()=>Cloud.user&&getDoc(doc(db,'users',Cloud.user.uid)).then(sn=>applyUser(sn.exists()?sn.data():null)).catch(e=>console.warn(e));
  loadCfg();let lt=Date.now();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lt>120000){lt=Date.now();loadCfg();loadUser()}});
  onAuthStateChanged(auth,u=>{if(!u&&Cloud.user){S.log=[];S.off=[];S.casts=0;S.unlocked=[];S.base=0;S.memories=[];save();last=''}
    Cloud.ready=true;Cloud.user=u;Cloud.admin=!!u&&u.emailVerified===true&&(u.email||'').toLowerCase()===C.adminEmail.toLowerCase();
    onAuth();loadUser()});
}
</script>
