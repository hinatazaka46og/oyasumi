<script>

const parseCsv=t=>{const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===','){r.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}
  return R.slice(1).filter(x=>x.length>=4&&+x[0]>0).map(x=>({m:+x[0],d:+x[1],n:x[2].trim(),y:+x[3]}))};
async function loadSheets(){for(const[k,u]of[['ev',ZEN_CONFIG.eventsCsv],['bd',ZEN_CONFIG.birthdaysCsv]]){if(!u)continue;try{const r=await fetch(u);if(r.ok)EV[k]=parseCsv(await r.text())}catch(e){console.warn(e)}}

  if(L.length>1)evT=setInterval(()=>{e.style.opacity=0;setTimeout(()=>{evI=(evI+1)%evL.length;e.textContent=evL[evI];e.style.opacity=1},450)},4500)}

  EV.bd.forEach(b=>{const nm=b.n.includes('·')?b.n.split('·').pop().trim():b.n.replace(/^[^\p{L}\p{N}]+/u,'').trim();let n=new Date(Y,b.m-1,b.d);if(n<t0)n=new Date(Y+1,b.m-1,b.d);
    const k=Math.round((n-t0)/864e5),txt=`${nm} ${n.getFullYear()-b.y}歲生日`;if(k===0)T.push(txt);else if(F&&nm.includes(F)&&k<=30)C.push(`${txt}　還有 ${k} 天`)});

  $('#sBody').innerHTML=`<h2>設定</h2><p class="sub">僅管理員可見，變更會同步給所有訪客。</p><div class="seg">${seg}</div>`+b;if(k&&$('#vm')){$('#vm').value=k[0];$('#vp').value=k[1]}}
function settingsInput(e){if(e.target.id==='vq'){ST.q=e.target.value;ST.lim=10;$('#vl').innerHTML=vList()}}

  if(act==='tab'){ST.tab=a.dataset.t;rSettings()}

/* cloud hooks (called by the Firebase module) */

/* history */
function streak(){const days=new Set(S.log.map(l=>dkey(new Date(l.ts))));let d=new Date(),n=0;if(!days.has(dkey(d)))d.setDate(d.getDate()-1);while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return{n,days}}
/* history & stats */
const H={y:new Date().getFullYear(),m:new Date().getMonth()+1};
let hc=null;
const tc=h=>h==null?'t0':h<6?'t1':h<7?'t2':h<8?'t3':h<9?'t4':'t5';
const hm=ts=>{const d=new Date(ts);return`${pad(d.getHours())}:${pad(d.getMinutes())}`};
function sessions(){const L=[...S.log].sort((a,b)=>a.ts-b.ts),out=[];let p=null;
  for(const l of L){if(l.type==='sleep')p=l;else if(l.type==='wake'&&p){const h=(l.ts-p.ts)/36e5;if(h>=1&&h<=20)out.push({day:dkey(new Date(l.ts)),s:p,w:l,h});p=null}}return out}
function hData(){const inR=ts=>{const d=new Date(ts);return d.getFullYear()===H.y&&(H.m===0||d.getMonth()+1===H.m)},days=new Map();
  S.log.filter(l=>inR(l.ts)).forEach(l=>{const k=dkey(new Date(l.ts));if(!days.has(k))days.set(k,{k,logs:[],h:null});days.get(k).logs.push(l)});
  sessions().filter(x=>inR(x.w.ts)).forEach(x=>{const d=days.get(x.day);if(d&&(d.h==null||x.h>d.h)){d.h=x.h;d.s=x.s;d.w=x.w;const sk=dkey(new Date(x.s.ts));if(sk!==x.day){const sd=days.get(sk);if(sd){sd.logs=sd.logs.filter(l=>l.id!==x.s.id);if(!sd.logs.length)days.delete(sk)}d.logs.push(x.s)}}});
  const rows=[...days.values()].sort((a,b)=>b.k.localeCompare(a.k)),m=rows.filter(d=>d.h!=null),ok=m.filter(d=>d.h>=S.goal).length;
  return{rows,avg:m.length?m.reduce((a,d)=>a+d.h,0)/m.length:null,total:rows.length,rate:m.length?Math.round(ok/m.length*100):null}}
function countUp(el,to,dec){if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to.toFixed(dec);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec);if(p<1)requestAnimationFrame(f)})(t0)}
function drawChart(rows){hc&&(hc.destroy(),hc=null);const w=$('#hcw'),pts=rows.filter(d=>d.h!=null).reverse();
  if(!pts.length){w.innerHTML='<div class="empty">此區間沒有睡眠資料<br>先按「晚安」，起床時再按「早安」。</div>';return}
  if(!window.Chart){w.innerHTML='<div class="empty">圖表載入失敗，請檢查網路</div>';return}
  w.innerHTML='<canvas id="hc"></canvas>';const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim(),blue=v('--blue'),vals=pts.map(d=>+d.h.toFixed(1)),f={family:v('--sans').split(',')[0].replace(/"/g,''),size:11};
  hc=new Chart($('#hc'),{type:'line',data:{labels:pts.map(d=>d.k.slice(5)),datasets:[
    {data:vals,borderColor:blue,borderWidth:2,tension:.4,pointRadius:pts.length>31?0:3,pointHoverRadius:5,pointBackgroundColor:v('--bg'),pointBorderColor:blue,pointBorderWidth:2,fill:true,
     backgroundColor:c=>{const a=c.chart.chartArea;if(!a)return blue+'33';const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,blue+'73');g.addColorStop(1,blue+'00');return g}},
    {data:pts.map(()=>S.goal),borderColor:v('--mute'),borderDash:[4,5],borderWidth:1,pointRadius:0,fill:false}]},
   options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},animation:{duration:matchMedia('(prefers-reduced-motion:reduce)').matches?0:900,easing:'easeOutBack'},
    plugins:{legend:{display:false},tooltip:{filter:i=>i.datasetIndex===0,backgroundColor:v('--ink'),titleColor:v('--bg'),bodyColor:v('--bg'),cornerRadius:12,padding:10,displayColors:false,callbacks:{label:i=>`${i.parsed.y} 小時`}}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{color:v('--mute'),font:f,maxTicksLimit:7,maxRotation:0}},
     y:{suggestedMin:Math.max(0,Math.floor(Math.min(...vals,S.goal)-1)),suggestedMax:Math.ceil(Math.max(...vals,S.goal)+1),grid:{color:v('--line')},border:{display:false},ticks:{color:v('--mute'),font:f,callback:n=>n+'h'}}}}})}
function hUpdate(){const D=hData();
  [['k1','u1',D.avg,1],['k2','u2',D.total,0],['k3','u3',D.rate,0]].forEach(([k,u,x,d])=>{const e=$('#'+k);$('#'+u).hidden=x==null;x==null?e.textContent='—':countUp(e,x,d)});
  drawChart(D.rows);
  $('#hl').innerHTML=D.rows.length?D.rows.map(d=>{const dt=new Date(d.k+'T00:00:00'),pl=d.logs.find(l=>S.videos.some(x=>x.id===l.vid)),st=d.h==null?'':tc(d.h),
    t=d.s&&d.w?`${hm(d.s.ts)} → ${hm(d.w.ts)}`:d.logs.slice().reverse().map(l=>(l.type==='wake'?'☀️ ':'🌙 ')+hm(l.ts)).join('　');
    return`<div class="rec" role="button" tabindex="0" data-id="${pl?pl.id:''}" data-k="${d.k}"><div class="rl"><i class="dot ${st}"></i><div><b>${dt.getMonth()+1}月${dt.getDate()}日　週${W[dt.getDay()]}</b><br><small>${t}</small></div></div><span class="rr"><span class="hv">${d.h!=null?d.h.toFixed(1)+'h':'—'}</span><button class="ed" aria-label="編輯時間">✎</button></span></div>`}).join(''):'<div class="empty">此區間沒有紀錄<br>回到首頁，打下第一個卡。</div>'}
function rHistory(){hc&&(hc.destroy(),hc=null);const ys=[...new Set([new Date().getFullYear(),...S.log.map(l=>new Date(l.ts).getFullYear())])].sort((a,b)=>b-a);if(!ys.includes(H.y))H.y=ys[0];
  const{n,days}=streak(),sh=new Map();sessions().forEach(x=>{if(!sh.has(x.day)||x.h>sh.get(x.day))sh.set(x.day,x.h)});
  const used=new Map();sessions().forEach(x=>used.set(x.s.id,x.day));
  const dl=k=>S.log.filter(l=>dkey(new Date(l.ts))===k&&!(used.has(l.id)&&used.get(l.id)!==k)),
  info=d=>{const k=dkey(d),h=sh.get(k),L=dl(k);return h!=null?{has:1,c:tc(h),t:+h.toFixed(1)}:L.length?{has:1,c:'t0',t:L.some(l=>l.type==='wake')?'☀️':'🌙'}:{has:0,c:'',t:''}};
  const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const p=new Date(d);p.setDate(p.getDate()-1);const a=info(d),b=info(p);return`<div class="day ${a.c} ${a.has&&b.has?'lk':''}"><i>${a.t}</i>${W[d.getDay()]}</div>`}).join('');
  $('#hBody').innerHTML=`<h2>歷史</h2><p class="sub">睡眠時數以「晚安」到「早安」之間的時間估算。</p>
  <div class="flt"><select id="hy" aria-label="年份">${ys.map(y=>`<option value="${y}" ${y===H.y?'selected':''}>${y} 年</option>`).join('')}</select><select id="hm" aria-label="月份"><option value="0" ${H.m===0?'selected':''}>全年</option>${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${H.m===i+1?'selected':''}>${i+1} 月</option>`).join('')}</select><select id="hg" aria-label="睡眠目標">${[6,6.5,7,7.5,8,8.5,9].map(g=>`<option value="${g}" ${g===S.goal?'selected':''}>目標 ${g}h</option>`).join('')}</select></div>
  <div class="stats"><div class="card stat"><b><span id="k1">0</span><small id="u1">h</small></b><span>平均睡眠</span></div><div class="card stat"><b><span id="k2">0</span><small id="u2">天</small></b><span>打卡天數</span></div><div class="card stat"><b><span id="k3">0</span><small id="u3">%</small></b><span>目標達成率</span></div></div>
  <div class="card"><div class="name">睡眠趨勢</div><div class="hcw" id="hcw"></div></div>
  <div class="card"><div class="row"><div class="name">連續 ${n} 天</div><div class="meta" style="margin:0">近 7 天</div></div><div class="week" style="margin-top:16px">${wk}</div><div class="badges">${[3,7,14,30].map(x=>`<span class="badge ${n>=x?'on':''}">連續 ${x} 天</span>`).join('')}</div></div>
  <div class="lg">${[['t1','未達標 &lt;6h'],['t2','6h'],['t3','7h'],['t4','8h'],['t5','9h 以上'],['','資料不完整']].map(([c,n])=>`<span><i class="dot ${c}"></i>${n}</span>`).join('')}</div><button class="btn" id="addfix" style="width:100%;margin-bottom:14px">＋ 補打卡</button><div id="hl"></div>`;hUpdate()}
$('#hBody').onchange=e=>{const t=e.target;if(t.id==='hy')H.y=+t.value;else if(t.id==='hm')H.m=+t.value;else if(t.id==='hg'){S.goal=+t.value;save();Cloud.pushUser()}else return;hUpdate()};
let fixO={s:null,w:null};
const fdt=t=>t?`${dkey(new Date(t))}T${hm(t)}`:'';
function fixOpen(k){const D=k?hData().rows.find(r=>r.k===k):null;fixO={s:D?(D.s||D.logs.find(l=>l.type==='sleep')||null):null,w:D?(D.w||D.logs.find(l=>l.type==='wake')||null):null};
  $('#fs').value=fdt(fixO.s&&fixO.s.ts);$('#fw').value=fdt(fixO.w&&fixO.w.ts);$('#fs').max=$('#fw').max=fdt(Date.now());$('#fix').classList.add('on')}
$('#fNo').onclick=()=>$('#fix').classList.remove('on');
$('#fOk').onclick=()=>{const now=Date.now(),v=[['sleep',fixO.s],['wake',fixO.w]],T=[$('#fs').value,$('#fw').value].map(x=>x?new Date(x).getTime():null);
  if(T.some(t=>t&&t>now))return toast('不能補未來的時間');if(T[0]&&T[1]&&T[1]<=T[0])return toast('早安需晚於晚安');
  let L=S.log.slice(),ch=false;
  v.forEach(([ty,o],i)=>{const t=T[i];if(o&&(!t||t!==o.ts)){L=L.filter(l=>l.id!==o.id);ch=true}
    if(t&&(!o||t!==o.ts)){const dk=dkey(new Date(t));L=L.filter(l=>!(l.type===ty&&dkey(new Date(l.ts))===dk));L.push({id:now+i,type:ty,ts:t,mid:o?o.mid:null,vid:o?o.vid:null,manual:true});ch=true}});
  if(ch){S.log=dedupe(L).slice(0,400);save();Cloud.pushUser();toast('已儲存')}$('#fix').classList.remove('on');rHistory()};
$('#hBody').onclick=e=>{if(e.target.closest('#addfix'))return fixOpen(null);const ed=e.target.closest('.ed');if(ed)return fixOpen(ed.closest('.rec').dataset.k);const b=e.target.closest('.rec');if(!b)return;const l=S.log.find(x=>String(x.id)===b.dataset.id),v=l&&S.videos.find(x=>x.id===l.vid);v?play(v):toast('這支影片已被刪除')};

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,deleteUser} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=ZEN_CONFIG;
if(C.firebase.apiKey&&!C.firebase.apiKey.startsWith('YOUR')){
  const app=initializeApp(C.firebase),auth=getAuth(app),db=getFirestore(app),gp=new GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});
  Cloud.off=false;
  Cloud.login=async()=>{try{await signInWithPopup(auth,gp)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))signInWithRedirect(auth,gp);else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast('登入失敗：'+e.code)}};
  Cloud.logout=()=>signOut(auth);
  let dead=false,tmr=null,last='';
  const fail=e=>{console.warn(e);last='';if(e&&e.code==='resource-exhausted'){if(!dead){dead=true;toast('雲端今日用量已滿，暫時只存在本機')}}else toast('同步失敗，請稍後再試')};
  Cloud.pushUser=()=>{if(!Cloud.user||dead)return;clearTimeout(tmr);tmr=setTimeout(()=>{const sig=JSON.stringify([S.log.map(l=>l.id),S.off,S.goal]);if(sig===last)return;last=sig;setDoc(doc(db,'users',Cloud.user.uid),{log:S.log,off:S.off,goal:S.goal,t:Date.now()}).catch(fail)},2000)};
  Cloud.pushCfg=()=>{if(Cloud.admin&&!dead)setDoc(doc(db,'config','main'),{members:S.members,videos:S.videos,bgs:S.bgs,events:S.events||[],t:Date.now()}).catch(fail)};
  Cloud.deleteAccount=async()=>{const u=auth.currentUser;if(!u)return;clearTimeout(tmr);
    try{await deleteDoc(doc(db,'users',u.uid));S.log=[];S.off=[];save();last='';render();await deleteUser(u);toast('已刪除你的資料與帳號')}
    catch(e){console.warn(e);toast(e.code==='auth/requires-recent-login'?'雲端紀錄已刪除。請登出後重新登入，再按一次以移除帳號':'刪除失敗：'+(e.code||'請稍後再試'))}};
  const loadCfg=()=>getDoc(doc(db,'config','main')).then(sn=>{if(sn.exists())applyCfg(sn.data())}).catch(e=>console.warn(e));
  const loadUser=()=>Cloud.user&&getDoc(doc(db,'users',Cloud.user.uid)).then(sn=>applyUser(sn.exists()?sn.data():null)).catch(e=>console.warn(e));

    onAuth();loadUser()});
}
