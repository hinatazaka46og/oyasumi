.rec{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:10px;border-radius:18px;background:var(--glass);border:1px solid var(--line);transition:transform .5s var(--sp)}
.rec:active{transform:scale(.97)}

/* player */
#player{position:fixed;inset:0;z-index:20;background:#000;opacity:0;visibility:hidden;transform:scale(1.06);transition:opacity .6s var(--out),transform .8s var(--sp),visibility 0s .8s}
#player.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s var(--out),transform .8s var(--sp)}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#back{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:20px;opacity:.55;transition:opacity .3s,transform .5s var(--sp)}
#back:hover{opacity:1}#back:active{transform:scale(.86)}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const PL={any:'通用',wake:'早安',sleep:'晚安'};
const Cloud={user:null,admin:false,off:true,pushUser(){},pushCfg(){}};
const PRESET={members:[{id:'m1',name:'成員 A',on:true},{id:'m2',name:'成員 B',on:true},{id:'m3',name:'成員 C',on:true}],
 videos:[/* {id:'v1',mid:'m1',period:'wake',name:'標題',url:'https://…/a.mp4'} */],
 bgs:[/* 'https://…/photo1.jpg' */]};
let S={...PRESET,alarm:{sleep:'23:00',wake:'07:00',sleepOn:false,wakeOn:false},log:[],off:[],goal:7};
try{const x=JSON.parse(localStorage.getItem('zen-ritual'));if(x)S={...S,...x}}catch(e){}
const isOn=m=>!S.off.includes(m.id);
const save=()=>{try{localStorage.setItem('zen-ritual',JSON.stringify(S))}catch(e){}};
/* toast */
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
/* clock */
const W=['日','一','二','三','四','五','六'];
function tick(){const d=new Date();$('#clk').innerHTML=`${pad(d.getHours())}<i style="opacity:${d.getSeconds()%2?.25:1}">:</i>${pad(d.getMinutes())}`;$('#sec').textContent=pad(d.getSeconds());$('#dt').textContent=`${d.getFullYear()}．${pad(d.getMonth()+1)}．${pad(d.getDate())}　週${W[d.getDay()]}`;checkAlarm(d)}
/* nav */
let cur='home';
function pill(){const b=$(`nav [data-v="${cur}"]`),p=$('#pill');p.style.width=b.offsetWidth+'px';p.style.transform=`translateX(${b.offsetLeft-6}px)`}
function show(v){cur=v;$('#bg').classList.toggle('off',!S.bgs.length||v!=='home');$$('.view').forEach(e=>e.classList.toggle('on',e.id===v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));pill();render();$('#'+v).scrollTop=0}
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b)show(b.dataset.v)};
addEventListener('resize',pill);
/* player */
let curURL=null;
function play(v){curURL=v.blob?URL.createObjectURL(v.blob):v.url;const el=$('#vid');el.src=curURL;el.loop=false;$('#player').classList.add('on');el.play().catch(()=>{})}
function stop(){const el=$('#vid');el.pause();$('#player').classList.remove('on');setTimeout(()=>{el.removeAttribute('src');el.load();if(curURL&&curURL.startsWith('blob:'))URL.revokeObjectURL(curURL);curURL=null},700)}
$('#back').onclick=stop;$('#vid').onerror=()=>{if($('#player').classList.contains('on')){toast('影片無法載入，請檢查網址');stop()}};$('#vid').onclick=e=>{e.target.paused?e.target.play():e.target.pause()};
addEventListener('keydown',e=>{if(e.key==='Escape')stop()});
function pick(type){const on=new Set(S.members.filter(isOn).map(m=>m.id));const pool=S.videos.filter(v=>on.has(v.mid)&&(v.period===type||v.period==='any'));if(!pool.length)return null;return pool[Math.floor(Math.random()*pool.length)]}
function go(type,btn,ev){const v=pick(type);if(!v){toast(S.videos.length?'已勾選的成員沒有符合時段的影片':'先到「設定」頁加入影片');return}
  if(btn&&ev){const r=btn.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,i=document.createElement('i');i.className='ripple';i.style.cssText=`width:${s}px;height:${s}px;left:${ev.clientX-r.left-s/2}px;top:${ev.clientY-r.top-s/2}px`;btn.appendChild(i)}
  S.log.unshift({id:Date.now(),type,ts:Date.now(),mid:v.mid,vid:v.id});S.log=S.log.slice(0,400);save();Cloud.pushUser();setTimeout(()=>play(v),btn?180:0)}
$$('[data-go]').forEach(b=>b.onclick=e=>go(b.dataset.go,b,e));
/* views */
function render(){if(cur==='members')rMembers();if(cur==='settings')rSettings();if(cur==='alarm')rAlarm();if(cur==='history')rHistory()}
/* background slideshow */
const cu=u=>u.replace(/['"()\s]/g,c=>encodeURIComponent(c)),okU=u=>/^https?:\/\/\S+$/i.test(u);
